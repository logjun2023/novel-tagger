# 切分规则（章节 → 段落 → 场景片段）
# 与用户库 <lib>/rules.user.yaml 自动合并（列表字段追加，字段值以用户库为准）

# 章节标题识别（按行匹配；目录表格行、<a id> 锚点行会自动跳过）
chapter_patterns:
  - '^\s*#{0,6}\s*第\s*(?:\d{1,5}|[零一二三四五六七八九十百千万两〇]{1,8})\s*[章回节卷集部篇]'
  - '^\s*#{0,6}\s*(?:番外(?:篇)?|尾声|终章|序章|楔子|引子|后记)(?:\s*[（(]?\s*(?:\d{1,3}|[零一二三四五六七八九十]{1,3})\s*[)）]?)?(?:\s*[：:.．\-、]\s*\S{1,24})?\s*$'
  - '^\s*#{0,6}\s*(?:Chapter|CHAPTER|Part|PART)\s+\d{1,4}'
  - '^\s*={2,}\s*第\s*(?:\d{1,5}|[零一二三四五六七八九十百千万两〇]{1,8})\s*[章回节卷集部篇]'
  - '^\s*#{0,6}\s*[【〖\[]\s*第\s*(?:\d{1,5}|[零一二三四五六七八九十百千万两〇]{1,8})\s*[章回节卷集部篇]'
chapter_title_max_len: 60

# 场景分隔标记（整行匹配：***、---、本章完 等）
break_markers:
  - '^\s*[*✱✳~＝=◇◆☆✦✧※·]{3,}\s*$'
  - '^\s*[-—─_]{3,}\s*$'
  - '^\s*[（(]?本章完[)）]?\s*$'

# 时间转场词：段落以此开头 → 切新片段，并自动打「scene:转场」
time_transitions:
  - 第二天
  - 次日
  - 翌日
  - 第三天
  - 当天晚上
  - 当晚
  - 当天夜里
  - 第二天一早
  - 第二天清晨
  - 清晨
  - 傍晚
  - 入夜
  - 深夜
  - 半夜
  - 半小时后
  - 一个小时后
  - 一小时后
  - 两个小时后
  - 片刻后
  - 不多时
  - 许久
  - 过了很久
  - 几天后
  - 数日后
  - 一周后
  - 半个月后
  - 一个月后
  - 三个月后
  - 半年后
  - 一年后
  - 三年后
  - 多年后

# 视角/场景切换词：段落以此开头 → 切新片段
refocus_prefixes:
  - 与此同时
  - 另一边
  - 另一头
  - 而此刻
  - 此时此刻
  - 就在此时
  - 画面一转

# 对话检测阈值：引号内字数占比 >= ratio_threshold 或 引号开头段落占比 >= para_threshold → 打「对话」
# label / negative_label：标签名可改；negative_label 设为「非对话」等值时，对白不达标的片段也打标签
dialogue:
  ratio_threshold: 0.38
  para_threshold: 0.5
  label: 对话
  negative_label: ""

# 转场标签名（片段以时间/转场词开头 → 打该标签；设为空字符串则不打）
transition:
  label: 转场

# 片段长度控制：超过 max_chars 在段落边界切；小于 min_chars 并入相邻片段
fragment:
  max_chars: 2400
  min_chars: 90

# 人物代词就近指代（本地消解，零 LLM）：
#   代词 → 目标：男/女（归属「最近一次提及」的同性别人物；本片段没有就看跨片段回溯窗口）
#                 pov（第一人称叙述者：需在 characters.yaml 给该人物标 pov: true；仅引号外的「我」才归属）
chars:
  pronouns:
    我: pov
    我们: pov
    他: 男
    他们: 男
    她: 女
    她们: 女
  carry_window: 3000    # 跨片段就近指代的回溯窗口（字符）

# 引号对（用于对话统计）
quote_pairs:
  - ['“', '”']
  - ['「', '」']
  - ['『', '』']
