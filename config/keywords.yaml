# 标准词库：标签 → 触发关键词 + 阈值（命中次数 >= threshold 才打标）
# 与用户库 <lib>/keywords.user.yaml 自动合并：
#   - 同维度同标签：关键词取并集，阈值以用户库为准
#   - 新标签/新维度：直接追加生效
# 调完词典后：python segment.py <小说文件> --lib <lib> --retag

scene:
  战斗:
    threshold: 3
    keywords: [出手, 攻击, 拳, 刀, 剑, 枪, 杀, 血, 招, 格斗, 轰, 炸, 斩, 刺, 击中, 倒地, 重伤, 闪避, 劈, 爆, 厮杀, 搏斗, 武器, 伤口]
  日常:
    threshold: 3
    keywords: [吃饭, 早餐, 午饭, 晚饭, 睡觉, 起床, 上班, 下班, 散步, 逛街, 买菜, 闲聊, 喝茶, 家务, 洗澡, 沙发, 电视, 咖啡, 洗碗, 打扫, 超市]
  情感:
    threshold: 2
    keywords: [心动, 脸红, 心跳, 喜欢, 爱你, 感动, 泪水, 抱紧, 温柔, 思念, 牵挂, 暧昧, 害羞, 亲吻, 牵手, 拥抱, 目光, 注视]
  回忆:
    threshold: 2
    keywords: [回忆, 那年, 小时候, 曾经, 往事, 记忆中, 想起, 还记得, 多年前, 当年, 从前, 那一年]
  环境:
    threshold: 4
    keywords: [天空, 阳光, 夜色, 月光, 街道, 城市, 大海, 山峰, 微风, 清风, 下雨, 雨水, 雪花, 灯火, 晨曦, 黄昏, 大树, 树叶, 云层, 空气, 远处, 窗外, 路灯]

